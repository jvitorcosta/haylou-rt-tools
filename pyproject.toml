[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haylou-rt-tools"
dynamic = ["version"]
description = "Unofficial tools for the Haylou RT (LS05S) watch: BLE protocol, .tbwf watch faces and a text preview."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "João Vitor Pinheiro da Costa" }]
keywords = ["haylou", "smartwatch", "watch-face", "ble", "reverse-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
]
dependencies = ["Pillow>=10.1", "fonttools>=4.40"]

[project.optional-dependencies]
ble = ["bleak>=0.22"]
dev = ["pytest>=8", "ruff==0.17.3", "build>=1.2"]

[project.urls]
Repository = "https://github.com/jvitorcosta/haylou-rt-tools"
Issues = "https://github.com/jvitorcosta/haylou-rt-tools/issues"

[project.scripts]
haylou = "haylou_tools.cli:main"

[tool.hatch.version]
path = "src/haylou_tools/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/haylou_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP031"]  # %-formatting is the house style.
